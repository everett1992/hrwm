[package]
name = "hrwm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "herbstluftwm-style frame tiling window manager for river 0.4"
repository = "https://github.com/everett1992/hrwm"
license = "BSD-2-Clause-Views"

[dependencies]
bitflags = "2"
libc = "0.2"
regex = "1"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"

[profile.release]
lto = true

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
