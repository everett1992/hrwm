name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; nothing in CI needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git rust libxkbcommon zizmor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Workflow security audit (zizmor)
        run: zizmor --offline .github/workflows

  test:
    runs-on: ubuntu-latest
    # Arch packages river 0.4; most distributions don't yet
    container: archlinux:latest@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git rust cargo-nextest libxkbcommon river foot ttf-dejavu diffutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --locked --all-targets
      - name: Unit tests
        run: cargo nextest run --locked
      - name: Smoke test against headless river
        run: tests/smoke.sh
      - name: Compare vendored protocols with river's
        # informational: a newer river may ship newer protocol versions
        run: |
          for f in protocol/*.xml; do
            installed=/usr/share/river-protocols/stable/$(basename "$f")
            cmp -s "$f" "$installed" \
              || echo "::notice file=$f::differs from $installed (river $(river -version)); consider updating"
          done
