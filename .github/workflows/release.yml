name: Release

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    # an older Ubuntu, so the binary runs on distributions with older glibc
    runs-on: ubuntu-22.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          name="hrwm-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/release/hrwm LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      # lets anyone check the tarball was built here:
      #   gh attestation verify hrwm-*.tar.gz --repo everett1992/hrwm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hrwm-*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" hrwm-*.tar.gz hrwm-*.tar.gz.sha256 \
            --title "hrwm $GITHUB_REF_NAME" --generate-notes --verify-tag
